<!-- DESAIN PEMBELAJARAN -->
      <fieldset>
        <legend>3. Desain Pembelajaran (CP Terbaru 2025)</legend>
        <label>Capaian Pembelajaran (CP):</label>
        <textarea id="cpText" rows="3" placeholder="Tuliskan Capaian Pembelajaran sesuai Fase & Permendikbud/BSKAP No. 046/H/KR/2025..."></textarea>

        <label>Lintas Disiplin Ilmu (Jika Ada):</label>
        <input type="text" id="lintasIlmu" placeholder="Informatika, Bahasa Indonesia, dll.">

        <label>Tujuan Pembelajaran:</label>
        <textarea id="tujuan" rows="3" placeholder="Dengan model PBL, siswa mampu..."></textarea>

        <label>Topik Pembelajaran:</label>
        <input type="text" id="topik" placeholder="Topik materi utama..." required>

        <div class="grid">
          <div>
            <label>Praktik Pedagogis (Model/Strategi):</label>
            <select id="pedagogis">
              <option value="Problem Based Learning (PBL)">Problem Based Learning (PBL)</option>
              <option value="Project Based Learning (PjBL)">Project Based Learning (PjBL)</option>
              <option value="Inquiry Based Learning">Inquiry Based Learning</option>
              <option value="Discovery Learning">Discovery Learning</option>
              <option value="Pembelajaran Kontekstual (CTL)">Pembelajaran Kontekstual (CTL)</option>
              <option value="Direct Instruction (Pembelajaran Langsung)">Direct Instruction (Pembelajaran Langsung)</option>
            </select>
          </div>

          <div>
            <label>Kemitraan Pembelajaran:</label>
            <select id="kemitraan">
              <option value="Lingkungan Sekolah & Guru Rumpun/Mapel Lain">Lingkungan Sekolah & Guru Rumpun/Mapel Lain</option>
              <option value="Orang Tua / Wali Peserta Didik">Orang Tua / Wali Peserta Didik</option>
              <option value="Masyarakat / Tokoh Masyarakat">Masyarakat / Tokoh Masyarakat</option>
              <option value="Mitra Profesional / Dunia Usaha & Industri">Mitra Profesional / Dunia Usaha & Industri</option>
              <option value="Peserta Didik Antar Kelas / Lintas Jenjang">Peserta Didik Antar Kelas / Lintas Jenjang</option>
            </select>
          </div>

          <div>
            <label>Lingkungan Pembelajaran:</label>
            <select id="lingkungan">
              <option value="Ruang Kelas Fisik & Budaya Belajar Kolaboratif">Ruang Kelas Fisik & Budaya Belajar Kolaboratif</option>
              <option value="Ruang Virtual / Learning Management System (LMS)">Ruang Virtual / Learning Management System (LMS)</option>
              <option value="Kombinasi Ruang Fisik, Virtual, dan Luar Kelas">Kombinasi Ruang Fisik, Virtual, dan Luar Kelas</option>
              <option value="Lingkungan Luar Sekolah / Alam Sekitar">Lingkungan Luar Sekolah / Alam Sekitar</option>
            </select>
          </div>

          <div>
            <label>Pemanfaatan Digital:</label>
            <select id="pemanfaatanDigital">
              <option value="Quizizz, Google Classroom, Canva">Quizizz, Google Classroom, Canva</option>
              <option value="Perpustakaan Digital, Forum Diskusi Daring">Perpustakaan Digital, Forum Diskusi Daring</option>
              <option value="Google Forms, Kahoot, LiveWorksheets">Google Forms, Kahoot, LiveWorksheets</option>
              <option value="YouTube Edukasi, Simulasi Daring (PhET)">YouTube Edukasi, Simulasi Daring (PhET)</option>
              <option value="AI Tools (ChatGPT/Gemini) & Penilaian Daring">AI Tools (ChatGPT/Gemini) & Penilaian Daring</option>
            </select>
          </div>
        </div>
      </fieldset>
      <!-- PENGALAMAN BELAJAR -->
      <fieldset>
        <legend>4. Pengalaman Belajar (Deep Learning)</legend>
        
        <label>Kegiatan Awal (Prinsip: Berkesadaran, Bermakna, Menggembirakan):</label>
        <select id="kegiatanAwal">
          <option value="Orientasi bermakna melalui salam, doa, tes kesiapan belajar, dilanjutkan apersepsi kontekstual dan motivasi menggembirakan.">Orientasi bermakna, apersepsi kontekstual, & motivasi menggembirakan</option>
          <option value="Menyanyikan lagu nasional/daerah, apersepsi dengan pertanyaan pemantik terkait kehidupan sehari-hari, serta penyampaian tujuan belajar.">Apersepsi pertanyaan pemantik & penyampaian tujuan pembelajaran</option>
          <option value="Ice breaking penggugah semangat, review materi sebelumnya, dan diskusi singkat terkait penerapannya dalam dunia nyata.">Ice breaking, review materi lalu, & diskusi relevansi dunia nyata</option>
        </select>

        <h4>Kegiatan Inti:</h4>
        <label>1. Memahami:</label>
        <select id="intiMemahami">
          <option value="Siswa mendiskusikan konsep dasar secara berkesadaran, mengamati stimulus visual/audio, dan mengidentifikasi masalah utama.">Mendiskusikan konsep dasar, amati stimulus, & identifikasi masalah</option>
          <option value="Siswa membaca literatur/bahan ajar secara mandiri dan mencatat poin-poin kunci terkait materi yang dipelajari.">Membaca literatur mandiri & merangkum poin-poin kunci</option>
          <option value="Siswa menyimak paparan materi dari guru dan mengajukan pertanyaan kritis terkait hal yang belum dipahami.">Menyimak paparan & mengajukan pertanyaan kritis</option>
        </select>

        <label>2. Mengaplikasi:</label>
        <select id="intiMengaplikasi">
          <option value="Siswa bekerjasama dalam kelompok menerapkan konsep pada studi kasus kontekstual dan menyelesaikan Lembar Kerja (LKPD).">Diskusi kelompok menyelesaikan studi kasus/LKPD kontekstual</option>
          <option value="Siswa merancang proyek/karya sederhana secara kolaboratif untuk menyelesaikan masalah nyata di lingkungan sekitar.">Merancang proyek/karya pemecahan masalah nyata</option>
          <option value="Siswa melakukan eksperimen/simulasi mandiri dan mengolah data hasil percobaan ke dalam laporan sederhana.">Melakukan eksperimen/simulasi & mengolah data hasil</option>
        </select>

        <label>3. Merefleksi:</label>
        <select id="intiMerefleksi">
          <option value="Siswa mempresentasikan hasil kerja kelompok, saling memberikan umpan balik (peer assessment), dan mengevaluasi solusi.">Presentasi kelompok, umpan balik antarteman, & evaluasi solusi</option>
          <option value="Siswa menyimpulkan pembelajaran bersama guru dan menganalisis kelebihan serta kekurangan dari proses belajar yang telah dilakukan.">Menyimpulkan pembelajaran & analisis kelebihan/kekurangan</option>
          <option value="Siswa menuliskan poin pembelajaran berharga (meaningful learning) dan tindak lanjut perbaikan untuk kegiatan berikutnya.">Menuliskan catatan pembelajaran berharga & tindak lanjut</option>
        </select>

        <label>Kegiatan Penutup:</label>
        <select id="kegiatanPenutup">
          <option value="Guru memberikan umpan balik konstruktif, penguatan materi, refleksi bersama, serta penyampaian tugas/materi berikutnya.">Umpan balik konstruktif, penguatan materi, & penugasan</option>
          <option value="Siswa melakukan evaluasi mandiri/kuis singkat, penyimpulan materi bersama, dan doa penutup.">Evaluasi/kuis singkat, kesimpulan, & doa penutup</option>
          <option value="Apresiasi kinerja siswa/kelompok, refleksi emosional belajar, dan penyampaian rencana pembelajaran selanjutnya.">Apresiasi kinerja, refleksi belajar, & rencana pertemuan depan</option>
        </select>
      </fieldset>

      <!-- ASESMEN PEMBELAJARAN -->
      <fieldset>
        <legend>5. Asesmen Pembelajaran</legend>

        <label>Asesmen Awal (Diagnostic):</label>
        <select id="asesmenAwal">
          <option value="Tes lisan singkat & kuesioner pemetaan kesiapan belajar siswa">Tes lisan singkat & kuesioner kesiapan belajar</option>
          <option value="Kuis interaktif singkat (Quizizz/Kahoot) sebelum materi dimulai">Kuis interaktif singkat (Quizizz/Kahoot)</option>
          <option value="Lembar isian mandiri / Angket minat dan pengetahuan awal">Lembar isian mandiri / Angket pengetahuan awal</option>
        </select>

        <label>Asesmen Proses (Formatif):</label>
        <select id="asesmenProses">
          <option value="Observasi diskusi kelompok, rubrik partisipasi, dan Lembar Kerja (LKPD)">Observasi diskusi, rubrik partisipasi, & LKPD</option>
          <option value="Penilaian antarteman (peer assessment) dan catatan anekdot kinerja siswa">Penilaian antarteman (peer assessment) & catatan kinerja</option>
          <option value="Jurnal refleksi harian & penilaian presentasi kelompok">Jurnal refleksi harian & penilaian presentasi</option>
        </select>

        <label>Asesmen Akhir (Sumatif):</label>
        <select id="asesmenAkhir">
          <option value="Penilaian produk/proyek, tes tertulis, dan rubrik presentasi">Penilaian produk/proyek, tes tertulis, & presentasi</option>
          <option value="Tes tertulis objektif/uraian di akhir bab">Tes tertulis objektif/uraian di akhir bab</option>
          <option value="Penilaian portofolio hasil karya dan unjuk kerja (performance assessment)">Penilaian portofolio hasil karya & unjuk kerja</option>
        </select>
      </fieldset>
